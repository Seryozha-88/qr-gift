<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Gift 🎁</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="gift-container">
    <div class="gift-content">
      <div id="loading" class="loading">Loading your gift...</div>

      <div id="giftData" style="display: none;">
        <h1 id="giftTitle" class="gift-title"></h1>
        <div id="imageContainer" class="image-container" style="display: none;">
          <img id="giftImage" src="" alt="Gift Image">
        </div>
        <div id="textContent" class="text-content"></div>
        <div id="audioContainer" class="audio-container" style="display: none;">
          <audio id="giftAudio" controls>
            <source id="audioSource" src="" type="audio/mpeg">
          </audio>
        </div>
      </div>

      <div id="error" class="error" style="display: none;">Gift page not found 😢</div>
    </div>
  </div>
  <script src="/gift.js"></script>
</body>
</html>
